# DBT (Direct Benefit Transfer) department - a standalone stand-in service, never a live source.
spring:
  application:
    name: samanvay-dept-dbt
  jackson:
    default-property-inclusion: non_null
server:
  # 8080 = samanvay-core, 8090 = shared simulators, 8091 = revenue, 8092 = dbt.
  port: ${DBT_PORT:8092}

department:
  # DEMO MODE is off unless DEPARTMENT_DEMO_MODE=true (or the dev profile: --spring.profiles.active=dev). Off, the service REFUSES to start
  # with a change-me default, a session secret under 32 bytes, the code 123456, a missing Samanvay client secret or a non-https public address.
  demo-mode: ${DEPARTMENT_DEMO_MODE:false}

portal:
  # The citizen portal served at /portal/ (shared kit). Never sent to a browser: the samanvay block.
  dept-code: DBT
  name: Direct Benefit Transfer
  initial: D
  accent: "#1e4fa3"
  accent-dark: "#8ab4ff"
  on-accent-dark: "#0a1630"
  public-base-url: ${DBT_PUBLIC_URL:http://localhost:8092}
  otp-code: ${DBT_LOGIN_CODE:123456}
  session-secret: ${DBT_SESSION_SECRET:}
  manifest-key-file: ${dbt.manifest.key-file:manifest-signing-key.jwk}
  samanvay:
    base-url: ${SAMANVAY_URL:http://localhost:8080}
    token-url: ${SAMANVAY_TOKEN_URL:http://localhost:8180/realms/samanvay-staff/protocol/openid-connect/token}
    client-id: ${SAMANVAY_CLIENT_ID:dept-dbt}
    client-secret: ${SAMANVAY_CLIENT_SECRET:}

dbt:
  # The address Samanvay uses to reach this service; published in the manifest identity block.
  public-base-url: ${DBT_PUBLIC_URL:http://localhost:8092}
  login:
    assertion-ttl: PT5M
    # Samanvay addresses a login may redirect back to (prefix match). Anything else gets a 400, never a redirect.
    allowed-return-uris: ${DBT_ALLOWED_RETURN_URIS:http://localhost:8091/portal/callback,http://localhost:8093/portal/callback,http://localhost:8094/portal/callback}
    # Shown on the login page so a demo user knows which FAKE account to use. Empty hides it.
    demo-hint: "${DBT_LOGIN_HINT:Demo account (fake data): mobile 9000000001, password asha-demo-pass, one-time code 123456}"
    # Built-in demo citizens, used only when no database is configured: mobile|password|personId|name|dateOfBirth. FAKE dev accounts only.
    users: ${DBT_LOGIN_USERS:9000000001|asha-demo-pass|DBT-1001|Asha Patil|2004-03-09,9000000002|ravi-demo-pass|DBT-1002|Ravi Joshi|2003-11-21}
  # The department's own Postgres. Empty = use the built-in fake seed above (tests, bare local run). A deployment sets all three.
  db:
    url: ${DBT_DB_URL:}
    user: ${DBT_DB_USER:dbt_app}
    password: ${DBT_DB_PASSWORD:}
  oauth:
    # Samanvay's OAuth2 client for DBT (client-credentials grant). Dev defaults only.
    client-id: ${DBT_CLIENT_ID:samanvay-dev}
    client-secret: ${DBT_CLIENT_SECRET:dbt-dev-secret-change-me}
    scope: bank.read
    # How long an issued access token stays valid.
    token-ttl: ${DBT_TOKEN_TTL:PT10M}
