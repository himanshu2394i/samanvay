services:
  postgres:
    image: postgres:16
    environment:
      # samanvay_migrate owns every schema/table and runs migrations. The
      # running application never connects as this role - see
      # docs/architecture/lld/01-audit.md #1 for why: a role that owns a
      # table implicitly has every privilege on it regardless of REVOKE,
      # which would silently defeat audit's tamper-evidence guarantee.
      POSTGRES_DB: samanvay
      POSTGRES_USER: samanvay_migrate
      POSTGRES_PASSWORD: samanvay_migrate
    ports:
      - "5432:5432"
    volumes:
      - samanvay-postgres-data:/var/lib/postgresql/data

  # DEV-ONLY identity provider. Imports every realm in keycloak/realms on
  # first start. Staff: passkey, or password + TOTP. Citizen: email one-time
  # code (read it in Mailpit below), or passkey, or a sign-in brokered through
  # the MOCK department realm (samanvay-department: password + TOTP there;
  # portals send citizens with kc_idp_hint=dept-idp). No real government IdP is
  # involved; the brokered login is what DepartmentBrokerLinkProofProvider
  # accepts as a link proof (samanvay.identity.department-idp.enabled).
  # The citizen email-code authenticator is built by the Maven build (./mvnw -DskipTests package, or
  # any verify) into target/keycloak-providers - build before `up`.
  # `start-dev` = in-memory H2 + HTTP: never use this service outside a laptop.
  # The app finds it via samanvay.security.{staff,citizen}.issuer-uri
  # (dev/demo profiles default to http://localhost:8180).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://localhost:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_DEV_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - ./target/keycloak-providers:/opt/keycloak/providers:ro
    depends_on:
      - mailpit

  # DEV-ONLY mail catcher: the citizen realm sends sign-in codes to
  # mailpit:1025. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  samanvay-postgres-data:
