services:
  postgres:
    image: postgres:16
    environment:
      # samanvay_migrate owns every schema/table and runs migrations. The
      # application's runtime connection never uses this role (Flyway does, in-process, unless split out) - see
      # docs/architecture/lld/01-audit.md #1 for why: a role that owns a
      # table implicitly has every privilege on it regardless of REVOKE,
      # which would silently defeat audit's tamper-evidence guarantee.
      POSTGRES_DB: samanvay
      POSTGRES_USER: samanvay_migrate
      POSTGRES_PASSWORD: samanvay_migrate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - samanvay-postgres-data:/var/lib/postgresql/data

  # DEV-ONLY identity provider. Imports every realm in keycloak/realms on
  # first start. Staff: passkey, or password + TOTP. Citizen: email one-time
  # code (read it in Mailpit below), or passkey, or a sign-in brokered through
  # the MOCK department realm (samanvay-department: password + TOTP there;
  # portals send citizens with kc_idp_hint=dept-idp). No real government IdP is
  # involved; the brokered login is what DepartmentBrokerLinkProofProvider
  # accepts as a link proof (samanvay.identity.department-idp.enabled).
  # The citizen email-code authenticator is built by the Maven build (./mvnw -DskipTests package, or
  # any verify) into target/keycloak-providers - build before `up`.
  # `start-dev` = in-memory H2 + HTTP: never use this service outside a laptop.
  # The app finds it via samanvay.security.{staff,citizen}.issuer-uri
  # (dev/demo profiles default to http://localhost:8180).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://localhost:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_DEV_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:-admin}
      # DEMO SERVERS ONLY. Six digits (for example 000000) make the staff second factor ALSO accept that code and skip
      # authenticator-app enrolment. Unset (the default) means only real authenticator-app codes work. Never set it in production.
      SAMANVAY_DEMO_FIXED_OTP: ${SAMANVAY_DEMO_FIXED_OTP:-}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - ./target/keycloak-providers:/opt/keycloak/providers:ro
    depends_on:
      - mailpit

  # DEV-ONLY mail catcher: the citizen realm sends sign-in codes to
  # mailpit:1025. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      # SMTP for the app running on the host (dev profile: spring.mail.host=localhost).
      - "127.0.0.1:1025:1025"

  # DEV/DEMO-ONLY bank-check simulator: a separate Spring Boot app (simulators/, built by simulators/Dockerfile) on
  # http://localhost:8090 that implements our bank-check contract v1 (docs/contracts/bank-check-v1.yaml) with FAKE data.
  # The shared "sandbox department" that used to live here (income / marks / bank) is gone: the four separate department
  # services below (dept-revenue, dept-dbt, dept-education, dept-agriculture) replace it. Never a real system.
  bank-simulator:
    build: ./simulators
    ports:
      - "8090:8090"

  # DEV/DEMO-ONLY department DATABASE for the JDBC connector path (fourth protocol). A plain Postgres
  # seeded with FAKE pollution-control-board rows (docker/department-db/init.sql) and a read-only role
  # pcb_ro. On :5433 so it never clashes with the app's own postgres above. With the dev/demo profile
  # the app points the V198 JDBC source (sandbox-pollution-jdbc) here via
  # samanvay.sources.jdbc.sources.*.jdbc-url, so a fetch crosses the network through the real
  # JdbcQueryClient (parameterized SELECT only), not the in-process mock backend. Never a real system.
  # The connector's credential is source-sandbox-pollution-jdbc-credential = pcb_ro:pcb_ro_demo (see README).
  department-db:
    image: postgres:16
    environment:
      POSTGRES_DB: deptdb
      POSTGRES_USER: dept_admin
      POSTGRES_PASSWORD: dept_admin_demo
    ports:
      - "5433:5432"
    volumes:
      - ./docker/department-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # DEV/DEMO-ONLY department SFTP server for the SFTP_CSV connector path. Serves a FAKE property CSV
  # (docker/department-sftp/property.csv) over real SFTP on :2222. With the dev/demo profile the app
  # points the V193 SFTP source (sandbox-property-sftp) here, so a fetch crosses the network through
  # the real SftpCsvClient. The client PINS the server host key (no trust-on-first-use), so after the
  # first `up` capture the fingerprint and export SAMANVAY_SANDBOX_SFTP_HOSTKEY (see README). Login is
  # the DEV credential source-sandbox-property-sftp-credential = fixtureuser:fixturepass. Never real.
  department-sftp:
    image: atmoz/sftp:alpine
    command: ["fixtureuser:fixturepass:::outbound"]
    ports:
      - "2222:22"
    volumes:
      - ./docker/department-sftp/property.csv:/home/fixtureuser/outbound/property.csv:ro

  # DEV/DEMO-ONLY Revenue department SFTP server: serves Revenue's FAKE 7/12 land-record CSV
  # (departments/revenue/sftp/712.csv) on host port 2223. Login is a dev credential; override with
  # REVENUE_SFTP_PASSWORD. Samanvay pins the host key Revenue publishes in its manifest. Never real.
  revenue-sftp:
    image: atmoz/sftp:alpine
    command: ["revenue-sftp:${REVENUE_SFTP_PASSWORD:-revenue-sftp-dev}:::outbound"]
    ports:
      - "2223:22"
    volumes:
      - ./departments/revenue/sftp/712.csv:/home/revenue-sftp/outbound/712.csv:ro

  # DEV/DEMO-ONLY department services (fake data only; never real systems). Each is its own app with its
  # own data, manifest, security scheme and login: Revenue :8091 (REST + API key, + SFTP above), DBT :8092
  # (REST + OAuth2), Education :8093 (SOAP + WS-Security), Agriculture :8094 (JDBC view + SFTP below).
  # Samanvay learns each from http://<host>:<port>/.well-known/samanvay/manifest.
  # Each department SIGNS its manifest with a private key kept in /data (a named volume), so the key fingerprint an
  # admin approved survives container re-creation. Losing the volume rotates the key: Samanvay then refuses the
  # manifest until an admin approves the new fingerprint.
  dept-revenue:
    build: ./departments/revenue
    ports:
      - "8091:8091"
    environment:
      REVENUE_MANIFEST_KEY_FILE: /data/manifest-signing-key.jwk
    volumes:
      - dept-revenue-data:/data
  dept-dbt:
    build: ./departments/dbt
    ports:
      - "8092:8092"
    environment:
      DBT_MANIFEST_KEY_FILE: /data/manifest-signing-key.jwk
    volumes:
      - dept-dbt-data:/data
  dept-education:
    build: ./departments/education
    ports:
      - "8093:8093"
    environment:
      EDUCATION_MANIFEST_KEY_FILE: /data/manifest-signing-key.jwk
    volumes:
      - dept-education-data:/data
  dept-agriculture:
    build: ./departments/agriculture
    ports:
      - "8094:8094"
    environment:
      AGRICULTURE_MANIFEST_KEY_FILE: /data/manifest-signing-key.jwk
    volumes:
      - dept-agriculture-data:/data

  # DEV/DEMO-ONLY Agriculture department DATABASE (JDBC protocol): its own Postgres on :5434, seeded with FAKE
  # farmers by departments/agriculture/db/init.sql. Samanvay logs in as the read-only role agri_ro, which can
  # SELECT from the view v_farmer_record only (not the base table). Never a real system.
  agriculture-db:
    image: postgres:16
    environment:
      POSTGRES_DB: agridb
      POSTGRES_USER: agri_admin
      POSTGRES_PASSWORD: agri_admin_demo
    ports:
      - "5434:5432"
    volumes:
      - ./departments/agriculture/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # DEV/DEMO-ONLY Agriculture SFTP server: serves the FAKE crop-sowing CSV on :2224. Dev login only.
  agriculture-sftp:
    image: atmoz/sftp:alpine
    command: ["agri-sftp:${AGRICULTURE_SFTP_PASSWORD:-agri-sftp-dev}:::outbound"]
    ports:
      - "2224:22"
    volumes:
      - ./departments/agriculture/sftp/crop.csv:/home/agri-sftp/outbound/crop.csv:ro

volumes:
  samanvay-postgres-data:
  dept-revenue-data:
  dept-dbt-data:
  dept-education-data:
  dept-agriculture-data:
