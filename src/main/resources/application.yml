spring:
  application:
    name: samanvay-core
  datasource:
    # The app's runtime connection. Deliberately NOT samanvay_migrate -
    # see docs/architecture/lld/01-audit.md #1. This role owns nothing,
    # so its privileges are exactly what's explicitly granted, no more.
    url: jdbc:postgresql://localhost:5432/samanvay
    username: samanvay_app
    # No default: outside dev/demo/test the app refuses to start unless SAMANVAY_APP_DB_PASSWORD is set to a real
    # secret (DbCredentialsStartupCheck). The local default is in application-dev.yml/-demo.yml.
    password: ${SAMANVAY_APP_DB_PASSWORD:}
    hikari:
      # samanvay_app is created by V1; the pool must not fail the context
      # before Flyway has run against samanvay_migrate.
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Migrations run as the schema-owning admin role, separate from the
    # app's own runtime connection above.
    url: jdbc:postgresql://localhost:5432/samanvay
    user: samanvay_migrate
    password: ${SAMANVAY_MIGRATE_DB_PASSWORD:}
    placeholders:
      appRolePassword: ${SAMANVAY_APP_DB_PASSWORD:}
  modulith:
    events:
      # Spring Modulith's own internal event_publication table (the
      # transactional outbox). This is framework plumbing, not our domain
      # schema - our own tables stay entirely Flyway-owned. Letting
      # Modulith initialize its own table avoids hand-transcribing DDL
      # that has to match its JPA entity exactly across versions.
      jdbc-schema-initialization:
        enabled: true
  mail:
    # No spring.mail.host here on purpose: Boot then creates no JavaMailSender, the default context boots without
    # any SMTP server, and the EMAIL channel reports a failed DeliveryOutcome. The dev profile points at Mailpit.
    # Timeouts apply to whichever host is configured, so an unreachable SMTP server can never hang the dispatcher.
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # Passbook / cancelled-cheque uploads; the app also validates content and size (PassbookUpload).
      max-file-size: 256KB
      max-request-size: 512KB

samanvay:
  # Secrets provider (see SecretStoreStartupCheck). Unset = "env": the dev/demo EnvSecretStore, which generates
  # ephemeral keys and is REFUSED outside the dev/demo profiles. Production: SAMANVAY_SECRETS_PROVIDER=file and
  # SAMANVAY_SECRETS_DIR=<mounted dir, one base64 file per key>. Audit checkpoint key rotation:
  # samanvay.audit.checkpoint.signing-key-id (default v1).
  secrets:
    provider: ${SAMANVAY_SECRETS_PROVIDER:env}
    dir: ${SAMANVAY_SECRETS_DIR:}
  notifications:
    email:
      from: ${SAMANVAY_NOTIFICATIONS_EMAIL_FROM:no-reply@samanvay.local}
  catalog:
    # Hosts exempt from the private/loopback (SSRF) guard on manifest discovery and data sources. EMPTY by default and
    # in production; only dev/demo name the local department stand-ins.
    allowed-private-hosts: ${SAMANVAY_CATALOG_ALLOWED_PRIVATE_HOSTS:}
  identity:
    department-assertion:
      # Link proof kind DEPT_ASSERTION: the citizen logs in at the department itself and its signed assertion
      # (docs/contracts/login-assertion.md) is the proof. Always available; a department can be linked this way
      # only once its manifest's identity block has been onboarded.
      # Where a department login may send the citizen back to (prefix match). EMPTY = refuse every address (fail closed):
      # production must set this to the public portal address(es).
      allowed-return-prefixes: ${SAMANVAY_DEPARTMENT_RETURN_PREFIXES:}
      # Refuse a department's published-key URL on a private/loopback address (SSRF). Only dev/demo turn this off.
      allow-private-hosts: false
      # How recent the department login itself must be, and how long a started login stays valid.
      max-auth-age: PT10M
      login-ttl: PT10M
    department-idp:
      # Accept a department-brokered Keycloak sign-in as a link proof (LinkProofKind.DEPT_IDP,
      # DepartmentBrokerLinkProofProvider). Off by default: with it off the proof kind is refused
      # and not listed. The citizen realm's broker (keycloak/gen_realms.py) points at a MOCK
      # department realm; no real government IdP is integrated.
      enabled: ${SAMANVAY_DEPARTMENT_IDP_ENABLED:false}
      # Alias of the citizen realm's identity provider whose logins may prove a link.
      alias: dept-idp
      # How recent the department sign-in (auth_time) may be when the link is asserted.
      max-auth-age: PT10M
  bank-review:
    # Officer passbook uploads: the file is deleted on decision and after this window; the hash stays.
    retention: 30d
  consent:
    # Consent records are kept this long after they end (revoked or expired), then the purge job
    # deletes them with their events, grants and usage claims. 7 years; audit rows are never purged.
    retention: P2555D
  connector:
    # Connect timeout for outbound department calls. A one-check consent usage
    # claim still PENDING after 2x this (the stale window) is treated as
    # released (V189 consent_usage) and the next check may take it over.
    timeout: PT10S
    # One deadline over the WHOLE exchange: every retry attempt, connect, send
    # and the full body. On expiry the HTTP exchange is cancelled (DeadlineHttp).
    total-timeout: PT10S
    # Startup refuses a stale window that is not greater than
    # total-timeout (+ one retry wait when retries are on) + stale-margin.
    stale-margin: PT5S
    retry:
      max-attempts: 3
      wait: PT0.5S
  security:
    # The two trusted Keycloak realms. Tokens from any other issuer are
    # rejected with 401. Keys are fetched lazily by OIDC discovery, so the app
    # boots before Keycloak is up. Optional per realm: jwk-set-uri, or
    # public-key-location (pinned PEM).
    #
    # No issuer defaults here: outside the dev/demo profiles the app refuses to
    # boot unless both issuers are set and use https (RealmIssuerStartupCheck).
    # The local docker-compose Keycloak lives in application-dev.yml/-demo.yml.
    # Every accepted token must have this in `aud` (Keycloak audience mapper on
    # the clients below), typ=Bearer, and an azp from its realm's allow-list.
    audience: samanvay-api
    staff:
      issuer-uri: ${SAMANVAY_STAFF_ISSUER_URI:}
      ui-client-id: samanvay-staff-ui
      allowed-clients: samanvay-staff-ui, dept-scholarship-dev, dept-revenue, dept-dbt, dept-education, dept-agriculture
    citizen:
      issuer-uri: ${SAMANVAY_CITIZEN_ISSUER_URI:}
      ui-client-id: samanvay-citizen-ui
      allowed-clients: samanvay-citizen-ui

# Actuator is on the classpath only for the Micrometer registry (refused-call
# counter); no actuator endpoint is served over HTTP.
management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        exclude: "*"
