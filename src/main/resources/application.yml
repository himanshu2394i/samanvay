spring:
  application:
    name: samanvay-core
  datasource:
    # The app's runtime connection. Deliberately NOT samanvay_migrate -
    # see docs/architecture/lld/01-audit.md #1. This role owns nothing,
    # so its privileges are exactly what's explicitly granted, no more.
    url: jdbc:postgresql://localhost:5432/samanvay
    username: samanvay_app
    password: ${SAMANVAY_APP_DB_PASSWORD:samanvay_app_dev_password}
    hikari:
      # samanvay_app is created by V1; the pool must not fail the context
      # before Flyway has run against samanvay_migrate.
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Migrations run as the schema-owning admin role, separate from the
    # app's own runtime connection above.
    url: jdbc:postgresql://localhost:5432/samanvay
    user: samanvay_migrate
    password: ${SAMANVAY_MIGRATE_DB_PASSWORD:samanvay_migrate}
    placeholders:
      appRolePassword: ${SAMANVAY_APP_DB_PASSWORD:samanvay_app_dev_password}
  modulith:
    events:
      # Spring Modulith's own internal event_publication table (the
      # transactional outbox). This is framework plumbing, not our domain
      # schema - our own tables stay entirely Flyway-owned. Letting
      # Modulith initialize its own table avoids hand-transcribing DDL
      # that has to match its JPA entity exactly across versions.
      jdbc-schema-initialization:
        enabled: true
  servlet:
    multipart:
      # Passbook / cancelled-cheque uploads; the app also validates content and size (PassbookUpload).
      max-file-size: 256KB
      max-request-size: 512KB

samanvay:
  identity:
    department-idp:
      # Accept a department-brokered Keycloak sign-in as a link proof (LinkProofKind.DEPT_IDP,
      # DepartmentBrokerLinkProofProvider). Off by default: with it off the proof kind is refused
      # and not listed. The citizen realm's broker (keycloak/gen_realms.py) points at a MOCK
      # department realm; no real government IdP is integrated.
      enabled: ${SAMANVAY_DEPARTMENT_IDP_ENABLED:false}
      # Alias of the citizen realm's identity provider whose logins may prove a link.
      alias: dept-idp
      # How recent the department sign-in (auth_time) may be when the link is asserted.
      max-auth-age: PT10M
  bank-review:
    # Officer passbook uploads: the file is deleted on decision and after this window; the hash stays.
    retention: 30d
  connector:
    # Connect timeout for outbound department calls. A one-check consent usage
    # claim still PENDING after 2x this (the stale window) is treated as
    # released (V189 consent_usage) and the next check may take it over.
    timeout: PT10S
    # One deadline over the WHOLE exchange: every retry attempt, connect, send
    # and the full body. On expiry the HTTP exchange is cancelled (DeadlineHttp).
    total-timeout: PT10S
    # Startup refuses a stale window that is not greater than
    # total-timeout (+ one retry wait when retries are on) + stale-margin.
    stale-margin: PT5S
    retry:
      max-attempts: 3
      wait: PT0.5S
  security:
    # The two trusted Keycloak realms. Tokens from any other issuer are
    # rejected with 401. Keys are fetched lazily by OIDC discovery, so the app
    # boots before Keycloak is up. Optional per realm: jwk-set-uri, or
    # public-key-location (pinned PEM).
    #
    # No issuer defaults here: outside the dev/demo profiles the app refuses to
    # boot unless both issuers are set and use https (RealmIssuerStartupCheck).
    # The local docker-compose Keycloak lives in application-dev.yml/-demo.yml.
    # Every accepted token must have this in `aud` (Keycloak audience mapper on
    # the clients below), typ=Bearer, and an azp from its realm's allow-list.
    audience: samanvay-api
    staff:
      issuer-uri: ${SAMANVAY_STAFF_ISSUER_URI:}
      ui-client-id: samanvay-staff-ui
      allowed-clients: samanvay-staff-ui, dept-scholarship-dev
    citizen:
      issuer-uri: ${SAMANVAY_CITIZEN_ISSUER_URI:}
      ui-client-id: samanvay-citizen-ui
      allowed-clients: samanvay-citizen-ui

# Actuator is on the classpath only for the Micrometer registry (refused-call
# counter); no actuator endpoint is served over HTTP.
management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        exclude: "*"
