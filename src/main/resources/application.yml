spring:
  application:
    name: samanvay-core
  datasource:
    # The app's runtime connection. Deliberately NOT samanvay_migrate -
    # see docs/architecture/lld/01-audit.md #1. This role owns nothing,
    # so its privileges are exactly what's explicitly granted, no more.
    url: jdbc:postgresql://localhost:5432/samanvay
    username: samanvay_app
    password: ${SAMANVAY_APP_DB_PASSWORD:samanvay_app_dev_password}
    hikari:
      # samanvay_app is created by V1; the pool must not fail the context
      # before Flyway has run against samanvay_migrate.
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Migrations run as the schema-owning admin role, separate from the
    # app's own runtime connection above.
    url: jdbc:postgresql://localhost:5432/samanvay
    user: samanvay_migrate
    password: ${SAMANVAY_MIGRATE_DB_PASSWORD:samanvay_migrate}
    placeholders:
      appRolePassword: ${SAMANVAY_APP_DB_PASSWORD:samanvay_app_dev_password}
  modulith:
    events:
      # Spring Modulith's own internal event_publication table (the
      # transactional outbox). This is framework plumbing, not our domain
      # schema - our own tables stay entirely Flyway-owned. Letting
      # Modulith initialize its own table avoids hand-transcribing DDL
      # that has to match its JPA entity exactly across versions.
      jdbc-schema-initialization:
        enabled: true
