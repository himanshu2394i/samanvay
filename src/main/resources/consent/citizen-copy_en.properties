# Citizen-facing consent copy (English, final). The one table for these
# strings: ConsentCopy reads it, ConsentCopyTableTest checks it is complete,
# and the banned-phrase scan reads it with the rest of src/main.
# {date} is the day the permission ended, e.g. "28 September 2026" (Asia/Kolkata).

# Why a department's check was refused (AccessDecision.Denied#message)
denied.CONSENT_REVOKED=You withdrew this permission, so this department can no longer check this document.
denied.CONSENT_EXPIRED=This permission ended on {date}, so this department can no longer check this document. If your application still needs it, you can give permission again.

# Status labels on the citizen's permissions list (ConsentArtifact#statusLabel)
status.ACTIVE=Active
status.EXPIRED=Ended
status.REVOKED=Withdrawn by you
