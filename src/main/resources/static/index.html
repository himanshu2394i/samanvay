<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Samanvay</title>
  <style>
    :root{--bg:#f3f5f6;--surface:#fff;--ink:#14202b;--muted:#44525e;--line:#c9d3da;--accent:#14587a;--on-accent:#fff;--focus:#0b57d0;--r:6px}
    @media (prefers-color-scheme: dark){:root{--bg:#0e151b;--surface:#16202a;--ink:#e9eff3;--muted:#a8b7c3;--line:#2f3f4b;--accent:#7cc0e0;--on-accent:#06151b;--focus:#8ab4ff}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:start center;padding:3rem 1rem;background:var(--bg);color:var(--ink);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
    main{width:100%;max-width:36rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem}
    h1{margin:0 0 .6rem;font-size:1.5rem;line-height:1.25}
    p{margin:0 0 .8rem}.muted{color:var(--muted)}
    a.button{display:inline-block;margin-top:.4rem;padding:.7rem 1.1rem;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
    a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <h1>Samanvay</h1>
    <p>The interoperability layer between departments. This site is for the Samanvay team and officers.</p>
    <p class="muted">Citizens do not sign in here. They use their own department's portal, and Samanvay works behind it with their consent.</p>
    <a class="button" href="/app/">Open the staff console</a>
  </main>
</body>
</html>
