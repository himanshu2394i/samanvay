<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Samanvay — citizen</title>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
    label { display: block; margin-top: 0.6rem; }
    button { margin-top: 1rem; }
    pre { background: #f4f4f4; padding: 0.8rem; overflow: auto; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Citizen</a>
    <a href="/ops.html">Ops</a>
    <a href="/audit.html">Audit</a>
    <a href="/onboard.html">Onboard</a>
  </nav>
  <h1>Citizen journeys</h1>
  <p>Thin UI. Keycloak brokering is stubbed. Payloads are never stored. See <code>docs/demo/PHASE4_RUNBOOK.md</code> for the eight-beat rehearsal.</p>
  <label>Citizen id <input id="citizenId" size="40"/></label>
  <button type="button" onclick="registerCitizen()">Register Ramesh</button>
  <button type="button" onclick="linkAndConsent()">Link + consent</button>
  <button type="button" onclick="startJourney()">Start scholarship</button>
  <label>Reference <input id="ref" size="30"/></label>
  <button type="button" onclick="loadStatus()">Load status</button>
  <pre id="out"></pre>
  <script>
    const out = document.getElementById('out');
    const log = (x) => out.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
    async function registerCitizen() {
      const id = await (await fetch('/api/identity/citizens', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          nameLatin:'Ramesh Kumar', nameDevanagari:'रमेश', familyName:'Kumar',
          fatherName:'Suresh', dob:'2004-01-15', dobPrecision:'DAY'
        })
      })).json();
      document.getElementById('citizenId').value = id;
      log({citizenId:id});
    }
    async function linkAndConsent() {
      const citizenId = document.getElementById('citizenId').value;
      for (const [departmentCode, localIdType, localId] of [
        ['REVENUE','RATION','RC-4471-88'],
        ['EDUCATION','STUDENT','STU-1001'],
        ['DBT','DBT','DBT-55']
      ]) {
        await fetch('/api/identity/links', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({citizenId, departmentCode, localIdType, localId, proof:'stub'})});
      }
      const req = await (await fetch('/api/consent/requests', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({citizenId, requesterId:'SCHOLARSHIP', purposeCode:'SCHOLARSHIP_ELIGIBILITY',
          purposeText:'Scholarship', categories:['INCOME_CERTIFICATE','CASTE_CERTIFICATE','MARKS','BANK_ACCOUNT']})
      })).json();
      const art = await (await fetch('/api/consent/requests/'+req.id+'/grant', {method:'POST',
        headers:{'Content-Type':'application/json','X-Auth-Jti':'ui-session'},
        body: JSON.stringify({citizenId})})).json();
      log({linked:true, consent:art});
    }
    async function startJourney() {
      const citizenId = document.getElementById('citizenId').value;
      const inst = await (await fetch('/api/journeys/POST_MATRIC_SCHOLARSHIP/start', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({citizenId, submission:{}})
      })).json();
      log(inst);
    }
    async function loadStatus() {
      const ref = document.getElementById('ref').value;
      const app = await (await fetch('/api/applications/'+ref)).json();
      const steps = await (await fetch('/api/applications/'+ref+'/steps')).json();
      log({app, steps});
    }
  </script>
</body>
</html>
