<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Samanvay — Onboard</title>
  <link rel="stylesheet" href="/console.css"/>
</head>
<body>
  <div class="shell" id="shell">
    <header class="mast">
      <div class="brand"><em>समन्वय</em> SAMANVAY</div>
      <div class="tag">Interoperability infrastructure — OpenAPI import is advisory. Humans still approve.</div>
    </header>
    <nav class="bar">
      <a href="/">Command</a>
      <a href="/journey.html">Journey</a>
      <a href="/ops.html">Incident</a>
      <a href="/audit.html">Audit</a>
      <a href="/onboard.html" class="active side">Onboard · tool</a>
      <a href="/caller.html" class="side">Caller · tool</a>
    </nav>
    <p class="lede">Supporting tool, not a primary judge surface. Suggestions are lexical. Nothing is saved until you tick a row and save.</p>
    <label>OpenAPI JSON
      <textarea id="spec">{
  "openapi": "3.0.0",
  "paths": {
    "/income": {
      "get": {
        "operationId": "getIncome",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "annual_income": { "type": "number" },
                    "holder_name": { "type": "string" }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}</textarea>
    </label>
    <label>Operation id <input id="op" value="getIncome"/></label>
    <label>Target schema <input id="schema" value="Credential/IncomeCertificate@1"/></label>
    <label>Mapping ref <input id="mapRef" value="map-import-demo@1"/></label>
    <label>Connector ref <input id="connRef" value="rev-income@1"/></label>
    <div class="row">
      <button type="button" id="previewBtn">Suggest mappings</button>
      <button type="button" id="saveBtn">Save approved only</button>
    </div>
    <div id="suggestions"></div>
    <pre id="out"></pre>
  </div>
  <script src="/console.js"></script>
  <script>
    let previewData = null;
    const log = (x) => { document.getElementById("out").textContent = typeof x === "string" ? x : JSON.stringify(x, null, 2); };
    document.getElementById("previewBtn").onclick = async () => {
      previewData = await api("/api/catalog/import/openapi", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          spec: document.getElementById("spec").value,
          operationId: document.getElementById("op").value,
          targetSchemaRef: document.getElementById("schema").value
        })
      });
      document.getElementById("suggestions").innerHTML = (previewData.suggestions || []).map((s, i) =>
        `<label><input type="checkbox" data-i="${i}"/> ${esc(s.source)} → ${esc(s.target)} (${esc(s.confidence)}, ${esc(s.rationale)})</label>`
      ).join("") || `<p class="empty">No suggestions.</p>`;
      log(previewData);
    };
    document.getElementById("saveBtn").onclick = async () => {
      if (!previewData) { log("preview first"); return; }
      const rules = [...document.querySelectorAll("#suggestions input:checked")].map(cb => {
        const s = previewData.suggestions[Number(cb.dataset.i)];
        return {source: s.source, target: s.target, transforms: []};
      });
      if (!rules.length) { log("approve at least one suggestion"); return; }
      log(await api("/api/catalog/mappings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          ref: document.getElementById("mapRef").value,
          connectorRef: document.getElementById("connRef").value,
          rules
        })
      }));
    };
  </script>
</body>
</html>
